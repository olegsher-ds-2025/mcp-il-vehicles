[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-il-vehicles"
version = "0.2.1"
description = "Israeli vehicle registry for AI agents: plate lookup, open recalls, model specs, new-car prices, licensed garages, EV chargers — live from data.gov.il"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oleg Sher" }]
keywords = ["mcp", "israel", "open-data", "data.gov.il", "model-context-protocol"]
dependencies = ["fastmcp>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mcp-il-vehicles = "mcp_il_vehicles.server:main"

[project.urls]
Repository = "https://github.com/olegsher-ds-2025/mcp-il-vehicles"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_il_vehicles"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits data.gov.il (run with -m live)"]
addopts = "-m 'not live'"
