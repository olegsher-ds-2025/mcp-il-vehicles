name: Publish to PyPI and MCP Registry

on:
  push:
    tags: ["v*", "[0-9]*"]   # v0.2.0 or 0.2.0
  workflow_dispatch:

permissions:
  contents: read   # least privilege by default; publish job elevates only what it needs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing + MCP Registry GitHub OIDC
      contents: read
      attestations: write  # GitHub artifact attestations (public repos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SJ=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          test "$TAG" = "$PY" && test "$TAG" = "$SJ" || { echo "tag=$TAG pyproject=$PY server.json=$SJ"; exit 1; }
      - run: pip install build && python -m build
      - name: GitHub artifact attestation (build provenance)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: sleep 60
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
